<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>WHO'S THAT POKÉMON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- Overlays décoratifs -->
<div class="scanline" aria-hidden="true"></div>
<div class="noise" aria-hidden="true"></div>

<main class="dex">

  <!-- Gauche : image + résultat -->
  <section class="left" aria-label="Image à deviner">
    <div class="top" aria-hidden="true">
      <div class="lens">
        <div class="lens__inner"></div>
        <div class="lens__glare"></div>
      </div>
      <div class="dots"><i></i><i></i><i></i></div>
      <img src="wtp-logo.png" class="logo" alt="" />
    </div>

    <div class="screen" id="screen">
      <div class="screen__grid" aria-hidden="true"></div>
      <span class="corner tl" aria-hidden="true"></span>
      <span class="corner tr" aria-hidden="true"></span>
      <span class="corner bl" aria-hidden="true"></span>
      <span class="corner br" aria-hidden="true"></span>
      <span class="qmark" aria-hidden="true">?</span>
      <img id="pokemon-img" alt="Silhouette d'un Pokémon à deviner" />
    </div>

    <div class="banner info" id="banner" role="status" aria-live="polite">
      <span class="ic" id="banner-icon" aria-hidden="true">❔</span>
      <span id="banner-text"></span>
    </div>

    <div class="speaker" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
  </section>

  <div class="hinge" aria-hidden="true">
    <div class="screw"></div>
    <div class="screw"></div>
  </div>

  <!-- Droite : jouer -->
  <section class="right" aria-label="Jouer">

    <div class="settings" role="group" aria-label="Réglages">
      <div class="seg" role="group" aria-label="Langue">
        <button id="lang-fr" aria-pressed="true">Français</button>
        <button id="lang-en" aria-pressed="false">English</button>
      </div>
      <button class="sound" id="btn-mute" aria-pressed="true"></button>
    </div>

    <!-- Petit écran : nom, niveau, stats -->
    <div class="lcd">
      <div class="lcd-name hidden" id="lcd-name" aria-hidden="true">_ _ _</div>
      <div class="lcd-row">
        <span class="lvl" id="level-display"></span>
        <div class="stats">
          <span><span data-t="lblOk"></span><b id="ok-n">0</b></span>
          <span><span data-t="lblKo"></span><b id="ko-n">0</b></span>
          <span><span data-t="lblStreak"></span><b id="streak-n">0</b></span>
        </div>
      </div>
      <div class="xp" id="xp-bar" role="progressbar" aria-valuemin="0" aria-valuemax="50" aria-valuenow="0"><div id="xp-fill"></div></div>
      <div class="xp-label" id="xp-label"></div>
    </div>

    <div>
      <label class="lab" for="guess-input" data-t="lab"></label>
      <div class="field">
        <input id="guess-input" type="text" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list" />
        <ul class="sugg" id="sugg" role="listbox" hidden></ul>
      </div>
    </div>

    <button class="btn primary" id="btn-guess" data-t="guess"></button>

    <div class="row">
      <button class="btn sec" id="btn-hint"><span data-t="hint"></span><small id="hint-cost"></small></button>
      <button class="btn sec" id="btn-reveal"><span data-t="reveal"></span><small data-t="revealSub"></small></button>
      <button class="btn sec skip" id="btn-skip"><span id="skip-label"></span><small id="skip-sub"></small></button>
    </div>

    <p class="keys" data-t="keys"></p>

    <!-- Croix directionnelle décorative -->
    <div class="dpad-area" aria-hidden="true">
      <div class="dpad">
        <div class="dpad__h"></div>
        <div class="dpad__v"></div>
        <div class="dpad__center"></div>
      </div>
      <div class="dpad-buttons">
        <span class="circle-btn a">A</span>
        <span class="circle-btn b">B</span>
      </div>
    </div>
  </section>
</main>

<!-- Popup niveau supérieur -->
<div class="levelup" id="levelup" role="dialog" aria-modal="true" aria-labelledby="levelup-title">
  <div class="levelup__box">
    <div class="levelup__title" id="levelup-title"></div>
    <div class="levelup__sub" id="levelup-sub"></div>
    <button class="levelup__ok" id="levelup-ok">OK</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
